<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Text-To-Image Generator</title>
<script src="https://js.puter.com/v2/"></script>
<style>
    * { box-sizing: border-box; }

    body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: #f3f5f9;
        color: #1f2330;
    }

    .topbar {
        height: 6px;
        background: #1f2330;
    }

    main {
        max-width: 900px;
        margin: 0 auto;
        padding: 40px 20px 80px;
        text-align: center;
    }

    h1 {
        font-size: 48px;
        font-weight: 800;
        margin: 30px 0 35px;
        color: #1f2330;
    }

    .search-row {
        display: flex;
        justify-content: center;
        gap: 0;
        margin-bottom: 35px;
    }

    #prompt {
        width: 520px;
        max-width: 70%;
        padding: 14px 18px;
        font-size: 16px;
        border: 1px solid #d6dae3;
        border-radius: 8px 0 0 8px;
        outline: none;
    }

    #prompt:focus {
        border-color: #2563eb;
    }

    #generateBtn {
        padding: 14px 28px;
        font-size: 16px;
        font-weight: 600;
        color: #fff;
        background: #2563eb;
        border: none;
        border-radius: 0 8px 8px 0;
        cursor: pointer;
        transition: background 0.15s ease;
    }

    #generateBtn:hover {
        background: #1d4ed8;
    }

    #generateBtn:disabled {
        background: #93b4f5;
        cursor: not-allowed;
    }

    .image-frame {
        width: 500px;
        max-width: 100%;
        height: 300px;
        margin: 0 auto;
        border-radius: 14px;
        overflow: hidden;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
        background: #eceff5;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
    }

    .image-frame img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
    }

    .spinner {
        width: 44px;
        height: 44px;
        border: 4px solid #d6dae3;
        border-top-color: #2563eb;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }

    .status {
        margin-top: 18px;
        font-size: 14px;
        color: #5a6072;
        min-height: 20px;
    }

    .error {
        color: #d92d20;
    }
</style>
</head>
<body>

<div class="topbar"></div>

<main>
    <h1>Text-To-Image Generator</h1>

    <div class="search-row">
        <input type="text" id="prompt" placeholder="Describe the image you want to see..." />
        <button id="generateBtn">Generate</button>
    </div>

    <div class="image-frame" id="imageFrame"></div>

    <div class="status" id="status"></div>
</main>

<script>
    const promptInput = document.getElementById('prompt');
    const generateBtn = document.getElementById('generateBtn');
    const imageFrame = document.getElementById('imageFrame');
    const statusEl = document.getElementById('status');

    const DEFAULT_IMG_URL = '../static/openimg.png';

    function renderDefault() {
        imageFrame.innerHTML = '';
        const img = new Image();
        img.src = DEFAULT_IMG_URL;
        img.alt = 'Welcome to our Text-to-Image Generator';
        imageFrame.appendChild(img);
    }

    function renderLoading() {
        imageFrame.innerHTML = '';
        const spinner = document.createElement('div');
        spinner.className = 'spinner';
        imageFrame.appendChild(spinner);
    }

    function renderImage(imgEl, prompt) {
        imageFrame.innerHTML = '';
        imgEl.alt = prompt;
        imageFrame.appendChild(imgEl);
    }

    async function generateImage() {
        const prompt = promptInput.value.trim();
        if (!prompt) {
            statusEl.textContent = 'Please enter a prompt first.';
            statusEl.classList.add('error');
            return;
        }

        statusEl.classList.remove('error');
        statusEl.textContent = 'Generating your image...';
        generateBtn.disabled = true;
        generateBtn.textContent = 'Generating...';
        renderLoading();

        try {
            const img = await puter.ai.txt2img(prompt, { model: "gemini-2.5-flash-image-preview" });
            renderImage(img, prompt);
            statusEl.textContent = 'Done!';
        } catch (err) {
            renderDefault();
            statusEl.classList.add('error');
            statusEl.textContent = 'Image generation failed: ' + (err?.message || err);
        } finally {
            generateBtn.disabled = false;
            generateBtn.textContent = 'Generate';
        }
    }

    renderDefault();

    generateBtn.addEventListener('click', generateImage);
    promptInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') generateImage();
    });
</script>

</body>
</html>
